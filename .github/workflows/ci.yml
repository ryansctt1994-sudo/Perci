name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  library-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the library test weight fixture
        run: |
          git lfs pull --include="models/perci-cognitive-v0.3.pwgt" --exclude=""
          test -s models/perci-cognitive-v0.3.pwgt
          if grep -aqm1 '^version https://git-lfs.github.com/spec/v1$' models/perci-cognitive-v0.3.pwgt; then
            echo "Expected model weights, got a Git LFS pointer" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --lib
